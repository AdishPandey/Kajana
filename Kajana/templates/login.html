<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kajana Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='Login.css') }}">
</head>


<body>

    <div class="logo">
        Kajana
    </div>


    <div class="login-container">

        <div class="avatar">
            👤
        </div>

        <h2>Login</h2>


        <form>

            <input type="text" placeholder="Username">


            <input type="password" placeholder="Password">


            <a href="#" class="create">
                Create Account
            </a>

            <a href="#">
                Forgot Password?
            </a>


            <button>
                Login →
            </button>

        </form>

    </div>


</body>

</html>
