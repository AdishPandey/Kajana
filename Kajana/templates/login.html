<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kajana Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='Login.css') }}">
</head>


<body>

    <div class="logo">
        Kajana
    </div>


    <div class="login-container">

        <div class="avatar">
            👤
        </div>

        <h2>Login</h2>


        <form action="/" method="POST">

            <input 
                type="text" 
                name="username" 
                placeholder="Username"
                required>


            <input 
                type="password" 
                name="password" 
                placeholder="Password"
                required>


            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}


            <a href="#" class="create">
                Create Account
            </a>


            <a href="#">
                Forgot Password?
            </a>


            <button type="submit">
                Login →
            </button>


        </form>


    </div>


</body>

</html>
