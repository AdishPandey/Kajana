<!DOCTYPE html>
<html lang="en">

<head>

    <title>Booking Status</title>

</head>

<body>

<h1>Booking Status</h1>

<a href="/dashboard">
    ← Dashboard
</a>

<br><br>

{% if bookings %}

<table border="1" cellpadding="10">

<tr>

    <th>ID</th>
    <th>Service</th>
    <th>Date</th>
    <th>Time</th>
    <th>Details</th>
    <th>Status</th>

</tr>

{% for booking in bookings %}

<tr>

    <td>{{ booking[0] }}</td>
    <td>{{ booking[1] }}</td>
    <td>{{ booking[2] }}</td>
    <td>{{ booking[3] }}</td>
    <td>{{ booking[4] }}</td>
    <td>

    <!-- Display current status -->
    {{ booking[5] }}

    <!-- Admin status update form -->
    <form action="/update_status/{{ booking[0] }}" method="POST">

        <select name="status">

            <option value="Pending">
                Pending
            </option>

            <option value="Confirmed">
                Confirmed
            </option>

            <option value="Completed">
                Completed
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>


        <button type="submit">
            Update
        </button>

    </form>

</td>


</tr>

{% endfor %}

</table>

{% else %}

<h3>No bookings found.</h3>

{% endif %}

</body>

</html>
